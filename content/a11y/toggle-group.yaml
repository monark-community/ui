component: ToggleGroup
wcag: AA
standard: WAI-ARIA 1.2
element: div
role: group
delegatesTo: "radix-ui (ToggleGroup)"
description: >
  Collection of toggles with either single-select (type="single",
  role="radiogroup" with radio items) or multi-select (type="multiple",
  role="group" with pressed buttons) semantics. Radix implements roving
  tabindex so the whole group is one tab stop and arrow keys move between
  items. variant="pill" draws the group as a segmented control (muted pill
  track, active item on bg-card) and variant="chip" as separate outlined
  pills (active item takes the primary tint); both keep the same semantics.

keyboard:
  - key: Tab
    action: Moves focus into the selected item (single mode) or the first item (multiple mode), and out of the group.
  - key: ArrowLeft / ArrowRight
    action: In single mode, moves selection between items (wraps by default). In multiple mode, moves focus without toggling.
  - key: ArrowUp / ArrowDown
    action: Same as Left / Right when orientation="vertical".
  - key: Home / End
    action: Moves to the first / last item.
  - key: Space / Enter
    action: In multiple mode, toggles the focused item.

focus:
  visible: true
  trapped: false
  notes: >
    Each item uses focus-visible:ring-[3px] focus-visible:ring-ring/50 via
    toggleVariants (pill / chip use focus-visible:ring-3 ring-ring/50 plus
    border-ring). Only one item in the group is a tab stop at a time (roving
    tabindex). Pill and chip items are h-10 (sm h-9) with an ::after hit area
    that reaches 44px tall.

screenReader:
  announcements:
    - Single mode announces as a radio group with the selected item's label.
    - Multiple mode announces as a group; each item announces with pressed / not pressed state.
  notes: >
    Context provides size / variant to children so consumers don't have to
    pass them on each item. Icon-only items still need an aria-label.

contrast:
  text: "Item text uses foreground; pressed state uses foreground on bg-muted. Both meet WCAG AA"
  ui: "Focus ring is a 3px ring-ring/50 halo; outline and chip variants use border-input (3.9:1), which meets AA non-text contrast. The chip's selected state is a primary-ink label on a primary/10 tint with a primary/40 border; the pill's selected item is bg-card on the bg-muted track with the label going from foreground/60 to foreground and bold weight kept, so selection is carried by more than the fill"

motion:
  reducedMotion: "Only a color transition on hover / state change; no motion-based animations"

consumerResponsibilities:
  - Provide an aria-label or aria-labelledby on ToggleGroup describing what's being toggled (e.g. "Text alignment").
  - Provide aria-label on icon-only items; the variant styling alone isn't enough for AT.
  - Use variant="pill" for 2 to 5 short mutually-exclusive views (a time range, a list filter); use variant="chip" for longer or wrapping sets of filters or options.
  - Pick type="single" for mutually-exclusive options (e.g. alignment left vs. center vs. right) and type="multiple" for independent toggles (e.g. text styling like bold, italic, underline).
