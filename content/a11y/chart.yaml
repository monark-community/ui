component: Chart
wcag: AA
standard: WAI-ARIA 1.2
element: div
role: null
delegatesTo: recharts
description: >
  Wrapper around Recharts 3 that injects a theme-aware CSS variable map and
  a ResponsiveContainer. The chart itself is an SVG drawn by Recharts.
  Recharts 3 enables its accessibilityLayer by default (the Monark examples
  also pass it explicitly), which makes the SVG surface a single tab stop
  with role="application" and lets arrow keys drive the tooltip.
  ChartTooltipContent and ChartLegendContent are presentational <div>s that
  Recharts positions over the active data point.

keyboard:
  - key: Tab
    action: Moves focus to the chart surface (one tab stop per chart).
  - key: ArrowRight / ArrowLeft
    action: Moves the active tooltip to the next / previous data point.
  - key: Enter
    action: Toggles the tooltip at the current data point.

focus:
  visible: true
  trapped: false
  notes: >
    The SVG surface gets tabIndex=0 from accessibilityLayer. The wrapper replaces
    the browser outline with the theme's ring-3 ring-ring/50 focus ring on
    the surface when it is focused from the keyboard, and the tooltip then
    follows arrow-key navigation.
    Keyboard navigation follows the tooltip axis, so it works best on
    category charts (bar, line, area); pie, radar and radial charts expose
    less through the keyboard. Setting accessibilityLayer={false} removes the
    tab stop and the arrow-key handling.

screenReader:
  announcements:
    - The surface is announced as an application region; individual shapes have no accessible name.
    - Tooltip text is not a live region, so arrow-key moves are not announced automatically.
  notes: >
    Charts are inherently visual. Pair every Chart with a textual summary
    (e.g. "ETH volume peaked in February at $305M") and/or a <table>
    containing the underlying data so assistive tech users get the same
    information. Recharts' title and desc props on the chart add <title> and
    <desc> to the SVG.

contrast:
  text: "Axis tick text uses fill-muted-foreground; still meets AA on bg-background"
  ui: >
    Series colors come from the consumer's ChartConfig, normally pointed at
    the --chart-1 to --chart-5 tokens. All five meet 3:1 on the background
    and on cards in both modes (light mode: --chart-1 #cd6600 at 3.7:1 and
    --chart-4 #9c8a52 at 3.3:1, the lowest). Adjacent series can still look
    alike to some viewers, so pair colour with a label, legend or line style. The wrapper does nothing to enforce contrast between
    adjacent series.

motion:
  reducedMotion: >
    Recharts animates data entry / updates. Pass `isAnimationActive={false}`
    on the chart primitives (Line, Bar, etc.) to disable animations, or
    gate it on a prefers-reduced-motion check.

consumerResponsibilities:
  - Provide a text alternative for every chart (summary paragraph, data table, or aria-describedby).
  - Don't rely on color alone; label series or slices, show a legend, or vary dash/shape/pattern.
  - Pick series colors with sufficient contrast against each other and the background; the ChartConfig schema does not validate this.
  - Keep accessibilityLayer on (the Recharts 3 default) for any chart with a tooltip.
