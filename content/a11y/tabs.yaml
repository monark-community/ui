component: Tabs
wcag: AA
standard: WAI-ARIA 1.2
element: div
role: tablist
delegatesTo: "radix-ui (Tabs)"
description: >
  Tabbed panels. TabsList is role="tablist"; each TabsTrigger is role="tab"
  with aria-selected and aria-controls pointing at its TabsContent
  (role="tabpanel", labelled by the trigger). Radix implements the WAI-ARIA
  tabs pattern with roving tabindex and optional automatic activation.

keyboard:
  - key: Tab
    action: Moves focus to the active tab trigger, then into its panel, then out.
  - key: ArrowLeft / ArrowRight
    action: Moves focus between triggers in a horizontal tablist (and activates the tab if activationMode is "automatic", the default).
  - key: ArrowUp / ArrowDown
    action: Same as Left / Right when orientation="vertical".
  - key: Home / End
    action: Moves focus to the first / last trigger.
  - key: Enter / Space
    action: Activates the focused trigger when activationMode is "manual".

focus:
  visible: true
  trapped: false
  notes: >
    Only the active trigger is in the tab sequence (roving tabindex); other
    triggers are tabindex=-1 but reachable via arrow keys. TabsTrigger
    shows focus-visible:ring-[3px] focus-visible:ring-ring/50 with
    focus-visible:border-ring and a 1px outline-ring. TabsContent is
    focusable (Radix tabIndex 0) and shows the same ring-3 ring-ring/50 on
    focus-visible.

screenReader:
  announcements:
    - Tablist announces as a tab list with its count.
    - Each trigger announces as a tab with its selected state.
    - Switching to a new tab moves the "selected" state and (if activationMode="automatic") shows the new panel immediately.
  notes: >
    For panels with heavy content, set activationMode="manual" so arrow
    keys move focus without switching panels; the user presses Enter /
    Space to commit. This avoids loading / rendering delays as users scan.

contrast:
  text: "Active trigger uses text-foreground on a bg-card pill; inactive uses text-foreground/60 (text-muted-foreground in dark mode). Both meet WCAG AA"
  ui: "Default variant: the active pill is bg-card inside a bg-muted, h-11 pill list (no shadow). Line variant: the active tab gets a 2px bg-foreground underline"

motion:
  reducedMotion: "Only colour / background transitions and the line variant's underline fade; no motion-based animations"

consumerResponsibilities:
  - Keep trigger labels concise; they're read in a list and long labels get truncated visually.
  - Consider activationMode="manual" for tabs that load expensive content, so arrow-key browsing doesn't thrash.
  - Don't nest Tabs more than one level; nested tabs are confusing for keyboard and screen reader users alike.
