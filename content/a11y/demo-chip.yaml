component: DemoChip
wcag: AA
standard: WAI-ARIA 1.2
element: span
role: null
delegatesTo: null
description: >
  Non-interactive pill that marks a site as a simulated demo. The dot is
  aria-hidden; screen readers read the label only.

keyboard: []

focus:
  visible: false
  trapped: false
  notes: "Non-interactive, not focusable."

screenReader:
  announcements:
    - 'Reads the label, e.g. "Demo".'
  notes: >
    The optional title ("Demo · simulated data") is a mouse tooltip only.
    The persistent "Demo · simulated data" notice belongs in the footer as
    visible text; don't rely on the chip's title for it.

contrast:
  text: "text-primary-ink on an 8% primary tint in light mode: 4.5:1 on the Monark cream background and 4.7:1 on white (a 15% tint would drop to 4.3:1 on cream). In dark mode, the primary on a 15% tint over espresso, well above 4.5:1."
  ui: "N/A"

motion:
  reducedMotion: "No animation."

consumerResponsibilities:
  - Translate the label ("Démo" is optional in French; "Demo" reads in both).
  - Keep a visible "Demo · simulated data" notice elsewhere on the page, such as the footer.
  - The chip needs the --primary-ink token; installing demo-chip (or theme-2026) adds it.
