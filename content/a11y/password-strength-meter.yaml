component: PasswordStrengthMeter
wcag: AA
standard: WAI-ARIA 1.2
element: div
role: null
delegatesTo: null
description: >
  Five segments plus a text label ("Strength: Fair") for a 0-4 score. The
  segments are visual only; the label carries the information. The root is
  an aria-live="polite" region, so screen readers announce the new label
  when the score changes.

keyboard: []

focus:
  visible: false
  trapped: false
  notes: "Non-interactive, not focusable."

screenReader:
  announcements:
    - 'Announces the label politely when it changes, e.g. "Strength: Strong".'
  notes: >
    Live updates fire on every score change while typing; polite
    announcements queue behind the typed characters. Link the meter to the
    password input with aria-describedby so the strength is read when the
    field gets focus.

contrast:
  text: "text-muted-foreground for the label (above 4.5:1), level in text-foreground."
  ui: "Segments are decorative; the unfilled ones use bg-border. Color is never the only cue: the label always states the level."

motion:
  reducedMotion: "Only a short background-color transition on the segments."

consumerResponsibilities:
  - Provide translated levels (and formatLabel) for non-English UIs.
  - Add aria-describedby on the password input pointing at the meter's id.
  - Explain requirements in text; the meter shows strength, not why a password is rejected.
