component: Accordion
wcag: AA
standard: WAI-ARIA 1.2
element: button
role: null
delegatesTo: "radix-ui (Accordion)"
description: >
  Vertically stacked, expandable panels. Each AccordionTrigger is a real
  <button> with aria-expanded and aria-controls wired to its AccordionContent
  region. Single-open and multi-open behaviors are supported via the type
  prop; Radix keeps aria-expanded in sync with visibility either way.
  variant="plus" is the monark.io FAQ style: larger bold questions and a
  + that rotates into an x when open. Every indicator icon is aria-hidden,
  so only aria-expanded carries the state.

keyboard:
  - key: Tab
    action: Moves focus to the next trigger (or out of the accordion).
  - key: Space / Enter
    action: Toggles the focused panel.
  - key: ArrowDown
    action: Moves focus to the next trigger; wraps to first at the end.
  - key: ArrowUp
    action: Moves focus to the previous trigger; wraps to last at the start.
  - key: Home
    action: Moves focus to the first trigger.
  - key: End
    action: Moves focus to the last trigger.

focus:
  visible: true
  trapped: false
  notes: >
    Triggers show focus-visible:ring-3 focus-visible:ring-ring/50 (the
    default variant adds focus-visible:border-ring). Panels and their contents share the same tab
    sequence as the rest of the page; focus is never trapped inside an open
    panel.

screenReader:
  announcements:
    - Each trigger is announced as a button with its current expanded state.
    - Content regions are announced as "region" labelled by their trigger.
  notes: >
    If you replace AccordionTrigger with a custom element via asChild, keep
    it a <button> so the implicit role survives; non-button triggers must
    add role="button" and tabIndex={0}.

contrast:
  text: "Trigger label uses foreground; meets WCAG AA on the default theme"
  ui: "Chevron icon uses muted-foreground and meets WCAG AA on bg-background. The plus variant's + is flat primary orange (about 2.3:1 on cream, as on monark.io); it is decorative and aria-hidden, and the open state is also conveyed by the icon's rotation and the revealed panel"

motion:
  reducedMotion: >
    Panels expand and collapse with the theme's animate-expand utility
    (0.2s ease-out height animation on --radix-collapsible-content-height,
    keyed off data-state). The theme turns it off under
    prefers-reduced-motion, so panels open and close instantly; the plus
    icon's rotation is motion-reduce:transition-none too.

consumerResponsibilities:
  - Provide a clear, descriptive label for each AccordionTrigger; it's the
    only text a screen reader has to convey what's inside.
  - When embedding interactive content inside a panel, ensure its tab order
    flows naturally after the trigger.
