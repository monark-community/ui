component: AlertDialog
wcag: AA
standard: WAI-ARIA 1.2
element: dialog
role: alertdialog
delegatesTo: "radix-ui (AlertDialog)"
description: >
  Modal confirmation dialog for high-stakes actions (delete, irreversible
  changes). Uses role="alertdialog" so assistive tech signals the
  interruption more assertively than a plain dialog. AlertDialogTitle and
  AlertDialogDescription are wired to aria-labelledby / aria-describedby
  automatically. variant="destructive" on AlertDialogContent tints
  AlertDialogMedia red and makes AlertDialogAction a solid red CTA
  (Button variant "destructive-solid") unless the action sets its own
  variant.

keyboard:
  - key: Tab
    action: Cycles focus through the dialog's interactive elements.
  - key: Shift+Tab
    action: Cycles focus backwards within the dialog.
  - key: Escape
    action: Closes the dialog without taking the action.
  - key: Enter
    action: Activates the focused button (typically Cancel or Action).

focus:
  visible: true
  trapped: true
  notes: >
    Focus is trapped inside the dialog while open. On close, focus returns
    to the element that opened the dialog. Radix handles the save / restore
    automatically.

screenReader:
  announcements:
    - "The dialog is announced with its role, title, and description in order."
  notes: >
    Because alertdialog interrupts more assertively than dialog, prefer it
    only for destructive or irreversible confirmations; use plain Dialog
    for routine flows.

contrast:
  text: "Title, description, and button labels all meet WCAG AA on the default theme. The destructive action is text-destructive-foreground on bg-destructive: 5.8:1 in light mode (white on #c81e0b) and 5.5:1 in dark mode (espresso on #fc452f). The destructive media icon is text-destructive on a 10% red tint (4.8:1 light, 4.4:1 dark), above the 3:1 non-text minimum"
  ui: "Overlay backdrop uses bg-overlay (black at 45%) for clear separation from the page"

motion:
  reducedMotion: >
    Radix's open / close uses fade + zoom via data-open:animate-in;
    wire motion-reduce:animate-none in your theme if strict
    reduced-motion compliance matters for your audience.

consumerResponsibilities:
  - Always render AlertDialogTitle and AlertDialogDescription; screen readers
    rely on them for context.
  - Label the destructive action button with a verb that matches the
    consequence ("Delete account", not just "OK"). Red is not the only cue;
    the verb and the title carry the warning.
  - Use variant="destructive" only for irreversible or data-losing actions.
  - Consider which button should receive initial focus. By default Radix
    focuses AlertDialogCancel when one is rendered; keep a Cancel in
    destructive flows so focus never lands on the action first.
